name: Refresh Crosspost Lockfile
on:
  push:
    branches: [codex/crosspost-bridge]
    paths: ["crosspost/package.json"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/crosspost-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crosspost/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
        working-directory: crosspost
      - run: |
          if git diff --quiet -- crosspost/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crosspost/package-lock.json
          git commit -m "Refresh crosspost lockfile"
          git push origin HEAD:codex/crosspost-bridge
