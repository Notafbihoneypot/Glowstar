name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-helper/**"
      - "tests/**"
      - "glowstr-v5.3-bluetooth-direct.html"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Run bundled static and protocol checks
        run: python3 tests/run_tests.py

      - name: Run cryptography self-test
        run: |
          mkdir -p android-helper/build/crypto-tests
          javac -encoding UTF-8 -d android-helper/build/crypto-tests \
            android-helper/app/src/main/java/org/glowstr/meshbridge/NostrCrypto.java \
            tests/java/org/glowstr/meshbridge/NostrCryptoSelfTest.java
          java -cp android-helper/build/crypto-tests org.glowstr.meshbridge.NostrCryptoSelfTest

      - name: Build debug APK
        run: gradle -p android-helper --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and prepare APK
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-helper/app/build.gradle | head -n1)"
          APK="dist/Glowstr-Android-${VERSION}-debug.apk"
          mkdir -p dist
          cp android-helper/app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          sha256sum "$APK" > "${APK}.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-APK
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub release APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-helper/app/build.gradle | head -n1)"
          TAG="v${VERSION}"
          APK="dist/Glowstr-Android-${VERSION}-debug.apk"
          SUM="${APK}.sha256"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Glowstr Android ${VERSION}" \
              --notes "Android debug build of Glowstr ${VERSION}. Fixes persistent login after app/process restarts by restoring remembered public identity from local storage, while keeping signing secrets non-persistent."
          fi

          gh release upload "${TAG}" "${APK}" "${SUM}" --clobber
