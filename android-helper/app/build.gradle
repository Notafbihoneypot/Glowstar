        def nativeQr = '''
// === ANDROID NATIVE NOSTR PUBKEY QR ===
if (window.GlowstrAndroid &&
    typeof window.GlowstrAndroid.startNostrQrScanner === 'function' &&
    typeof window.GlowstrAndroid.makeNostrQrDataUrl === 'function') {
  const __glowstrQrCharset = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
  let __glowstrQrPoll = null;

  function __glowstrQrPolymod(values) {
    const gen = [0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
    let chk = 1;
    for (const v of values) {
      const top = chk >>> 25;
      chk = (((chk & 0x1ffffff) << 5) ^ v) >>> 0;
      for (let i=0;i<5;i++) if ((top >>> i) & 1) chk = (chk ^ gen[i]) >>> 0;
    }
    return chk >>> 0;
  }

  function __glowstrQrHrpExpand(hrp) {
    const out = [];
    for (const c of hrp) out.push(c.charCodeAt(0) >>> 5);
    out.push(0);
    for (const c of hrp) out.push(c.charCodeAt(0) & 31);
    return out;
  }

  function __glowstrQrConvertBits(data, fromBits, toBits, pad) {
    let acc = 0, bits = 0;
    const ret = [], maxv = (1 << toBits) - 1, maxAcc = (1 << (fromBits + toBits - 1)) - 1;
    for (const value of data) {
      if (value < 0 || (value >> fromBits) !== 0) throw new Error('Invalid key data');
      acc = ((acc << fromBits) | value) & maxAcc;
      bits += fromBits;
      while (bits >= toBits) {
        bits -= toBits;
        ret.push((acc >> bits) & maxv);
      }
    }
    if (pad) {
      if (bits) ret.push((acc << (toBits - bits)) & maxv);
    } else {
      if (bits >= fromBits) throw new Error('Invalid bech32 padding');
      if (((acc << (toBits - bits)) & maxv) !== 0) throw new Error('Non-zero bech32 padding');
    }
    return ret;
  }

  function glowstrHexPubkeyToNpub(hex) {
    const h = String(hex || '').trim().toLowerCase();
    if (!/^[0-9a-f]{64}$/.test(h)) throw new Error('Invalid Nostr pubkey');
    const data = __glowstrQrConvertBits(Array.from(hexToBytes(h)), 8, 5, true);
    const values = __glowstrQrHrpExpand('npub').concat(data, [0,0,0,0,0,0]);
    const mod = (__glowstrQrPolymod(values) ^ 1) >>> 0;
    const checksum = [];
    for (let p=0;p<6;p++) checksum.push((mod >>> (5 * (5 - p))) & 31);
    return 'npub1' + data.concat(checksum).map(v => __glowstrQrCharset[v]).join('');
  }

  function glowstrParsePubkeyQr(raw) {
    let value = String(raw || '').trim();
    if (!value) throw new Error('QR code was empty');
    value = value.replace(/^nostr:/i, '').trim();
    if (/^[0-9a-f]{64}$/i.test(value)) {
      const hex = value.toLowerCase();
      return { hex, npub: glowstrHexPubkeyToNpub(hex) };
    }
    if (/^npub1[023456789acdefghjklmnpqrstuvwxyz]+$/i.test(value)) {
      const npub = value.toLowerCase();
      const decoded = decodeBech32(npub);
      if (!decoded || decoded.hrp !== 'npub' || decoded.bytes.length !== 32) throw new Error('Invalid npub QR code');
      return { hex: bytesToHex(decoded.bytes), npub };
    }
    throw new Error('QR is not a Nostr npub or 64-character pubkey');
  }

  function __glowstrQrClose() {
    document.getElementById('nostr-qr-modal')?.classList.remove('active');
  }

  function __glowstrQrOpenBase(title) {
    const modal = document.getElementById('nostr-qr-modal');
    if (!modal) return null;
    document.getElementById('nostr-qr-modal-title').textContent = title;
    document.getElementById('nostr-qr-image').style.display = 'none';
    document.getElementById('nostr-qr-profile').textContent = '';
    document.getElementById('nostr-qr-value').textContent = '';
    document.getElementById('nostr-qr-help').textContent = '';
    document.getElementById('nostr-qr-actions').replaceChildren();
    modal.classList.add('active');
    return modal;
  }

  function glowstrShowMyPubkeyQr() {
    if (!state.publicKey || !/^[0-9a-f]{64}$/.test(state.publicKey)) {
      showToast('Login first to show your follow QR');
      switchView('keys');
      return;
    }
    const npub = glowstrHexPubkeyToNpub(state.publicKey);
    // Uppercase keeps the QR in alphanumeric mode instead of byte mode.
    // Bech32 is valid in all-upper or all-lower case, never mixed case.
    const payload = ('NOSTR:' + npub).toUpperCase();
    const dataUrl = window.GlowstrAndroid.makeNostrQrDataUrl(payload);
    if (!dataUrl) { showToast('Could not generate QR code'); return; }
    __glowstrQrOpenBase('MY FOLLOW QR');
    const image = document.getElementById('nostr-qr-image');
    image.src = dataUrl;
    image.style.display = 'block';
    const profile = state.profiles?.[state.publicKey] || {};
    document.getElementById('nostr-qr-profile').textContent =
      profile.display_name || profile.name || 'Your Nostr identity';
    document.getElementById('nostr-qr-value').textContent = npub;
    document.getElementById('nostr-qr-help').textContent =
      'Low-density Nostr follow QR · optimized for phone-to-phone scanning · works offline.';
    const copy = document.createElement('button');
    copy.className = 'btn btn-small';
    copy.textContent = 'COPY NPUB';
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(npub); showToast('npub copied'); }
      catch(e) { showToast('Could not copy npub'); }
    };
    document.getElementById('nostr-qr-actions').appendChild(copy);
  }

  function __glowstrQrConfirmScanned(parsed) {
    const input = document.getElementById('search-input');
    if (input) input.value = parsed.npub;
    __glowstrQrOpenBase('FOLLOW SCANNED PUBKEY');
    const profile = state.profiles?.[parsed.hex] || {};
    document.getElementById('nostr-qr-profile').textContent =
      profile.display_name || profile.name || ('npub ' + parsed.npub.slice(5,17) + '…');
    document.getElementById('nostr-qr-value').textContent = parsed.npub;
    const already = state.following?.has(parsed.hex);
    document.getElementById('nostr-qr-help').textContent = already
      ? 'You already follow this pubkey.'
      : 'Confirm before adding this pubkey to your local follow list.';

    const actions = document.getElementById('nostr-qr-actions');
    const view = document.createElement('button');
    view.className = 'btn btn-small';
    view.textContent = 'VIEW PROFILE';
    view.onclick = () => { __glowstrQrClose(); viewUserProfile(parsed.hex); };
    actions.appendChild(view);

    if (!already) {
      const follow = document.createElement('button');
      follow.className = 'btn btn-small';
      follow.textContent = 'FOLLOW';
      follow.onclick = async () => {
        if (!state.publicKey) { showToast('Login first to follow'); __glowstrQrClose(); switchView('keys'); return; }
        if (!state.following.has(parsed.hex)) await toggleFollow(parsed.hex, null);
        __glowstrQrClose();
        showToast('✓ Followed scanned npub');
      };
      actions.appendChild(follow);
    }
  }

  function glowstrScanPubkeyQr() {
    if (__glowstrQrPoll) clearInterval(__glowstrQrPoll);
    let started = false;
    try { started = !!window.GlowstrAndroid.startNostrQrScanner(); } catch(e) {}
    if (!started) { showToast('Could not open QR scanner'); return; }
    showToast('Point camera at a Nostr npub QR');
    let tries = 0;
    __glowstrQrPoll = setInterval(() => {
      tries++;
      let raw = '';
      try { raw = window.GlowstrAndroid.pollNostrQrResult() || ''; } catch(e) {}
      if (!raw) {
        if (tries > 480) { clearInterval(__glowstrQrPoll); __glowstrQrPoll = null; showToast('QR scan timed out'); }
        return;
      }
      clearInterval(__glowstrQrPoll); __glowstrQrPoll = null;
      let result;
      try { result = JSON.parse(raw); } catch(e) { showToast('Invalid scanner result'); return; }
      if (result.cancelled) return;
      if (!result.ok) { showToast(result.error || 'QR scan failed'); return; }
      try {
        const parsed = glowstrParsePubkeyQr(result.text);
        try { if (!state.profiles?.[parsed.hex]) requestProfile(parsed.hex); } catch(e) {}
        __glowstrQrConfirmScanned(parsed);
      } catch(e) {
        showToast(e.message || 'Not a valid Nostr pubkey QR');
      }
    }, 250);
  }

  document.getElementById('nostr-show-my-qr-btn')?.addEventListener('click', glowstrShowMyPubkeyQr);
  document.getElementById('nostr-qr-scan-btn')?.addEventListener('click', glowstrScanPubkeyQr);
  document.getElementById('nostr-qr-modal-close')?.addEventListener('click', __glowstrQrClose);
  document.getElementById('nostr-qr-modal')?.addEventListener('click', e => {
    if (e.target?.id === 'nostr-qr-modal') __glowstrQrClose();
  });
}
'''

        def nativeAmber = '''
// === ANDROID NATIVE NIP-55 + STORE-AND-FORWARD QUEUE ===
if (window.GlowstrAndroid && typeof window.GlowstrAndroid.amberGetPublicKey === 'function') {
  let __glowstrAmberPoll = null;
  let __glowstrAmberBusy = false;
  let __glowstrAmberMode = null;
  let __glowstrMeshResolve = null;
  let __glowstrMeshReject = null;
  let __glowstrQueueDrainActive = false;
  let __glowstrQueuePendingId = null;
  let __glowstrQueuePauseUntil = 0;
  const __glowstrOriginalPublishQueued = glowstrPublishQueued;

  function __glowstrStopAmberPoll() {
    if (__glowstrAmberPoll) clearInterval(__glowstrAmberPoll);
    __glowstrAmberPoll = null;
  }

  function __glowstrFinishMeshSigning(error, signed) {
    const resolve = __glowstrMeshResolve;
    const reject = __glowstrMeshReject;
    __glowstrMeshResolve = null;
    __glowstrMeshReject = null;
    __glowstrAmberBusy = false;
    __glowstrAmberMode = null;
    document.getElementById('signing-indicator')?.classList.remove('active');
    if (error) {
      if (reject) reject(error instanceof Error ? error : new Error(String(error)));
    } else if (resolve) {
      resolve(signed);
    }
  }


  function __glowstrQueuePause(ms, message) {
    __glowstrQueuePauseUntil = Date.now() + Math.max(0, Number(ms) || 0);
    __glowstrQueueDrainActive = false;
    __glowstrQueuePendingId = null;
    __glowstrAmberBusy = false;
    __glowstrAmberMode = null;
    document.getElementById('signing-indicator')?.classList.remove('active');
    if (message) showToast(message);
  }

  async function __glowstrFinishQueuedSignedEvent(signed, requested) {
    const id = __glowstrQueuePendingId;
    const all = await glowstrOfflineGetAll();
    const rec = all.find(x => x.id === id && x.status === 'queued');
    if (!rec) {
      __glowstrQueuePause(0, 'Queued note was removed before publishing');
      return;
    }

    // Signed Nostr events are public data. Keep the already-verified signed event
    // until a relay ACK arrives so retries reuse the SAME event id instead of
    // creating duplicate notes if an ACK is lost.
    rec.signedEvent = signed;
    rec.signedRequested = requested;
    rec.updatedAt = Date.now();
    await glowstrOfflinePut(rec);

    const sent = broadcastEvent(signed);
    if (sent < 1) {
      __glowstrQueuePause(5000, 'Connection disappeared — signed note kept in queue');
      return;
    }

    const acked = await glowstrWaitForPublishAck(signed.id, 5000);
    if (!acked) {
      __glowstrQueuePause(15000, 'No relay ACK yet — exact signed event kept for retry');
      return;
    }

    await glowstrOfflineDelete(rec.id);
    await glowstrUpdateOfflineBadge();
    try { await glowstrRenderOfflineManager(); } catch(e) {}
    __glowstrQueueDrainActive = false;
    __glowstrQueuePendingId = null;
    __glowstrAmberBusy = false;
    __glowstrAmberMode = null;
    document.getElementById('signing-indicator')?.classList.remove('active');
    showToast('✓ Queued note published and acknowledged');
    setTimeout(() => __glowstrMaybeDrainQueue(false), 650);
  }

  async function __glowstrRetryAlreadySigned(rec) {
    if (!rec?.signedEvent || !rec?.signedRequested) return false;
    let valid = false;
    try { valid = await glowstrValidateSignerResult(rec.signedRequested, rec.signedEvent); }
    catch(e) { valid = false; }
    if (!valid) {
      delete rec.signedEvent;
      delete rec.signedRequested;
