        if (!text.contains('</script>')) throw new GradleException('Could not locate closing Glowstr script tag')
        text = text.replace('</script>', nativeAmber + '\n' + nativeQr + '\n</script>')

        def matcher = (text =~ /(?s)<script>(.*?)<\/script>/)
        if (!matcher.find()) throw new GradleException('Could not locate Glowstr inline script for CSP hash')
        def script = matcher.group(1)
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(script.getBytes('UTF-8'))
        def hash = java.util.Base64.encoder.encodeToString(digest)
        text = text.replaceFirst(/'sha256-[^']+'/, "'sha256-${hash}'")
        asset.setText(text, 'UTF-8')
    }
