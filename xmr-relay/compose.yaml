services:
  commerce:
    build: ../monero-commerce
    restart: unless-stopped
    network_mode: host
    environment:
      GLOWSTR_COMMERCE_HOST: 127.0.0.1
      GLOWSTR_COMMERCE_PORT: 8787
      MONERO_WALLET_RPC: ${MONERO_WALLET_RPC:-http://127.0.0.1:18083/json_rpc}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-}
      MONERO_RPC_PASS: ${MONERO_RPC_PASS:-}
      GLOWSTR_COMMERCE_ADMIN_TOKEN: ${GLOWSTR_COMMERCE_ADMIN_TOKEN:?set GLOWSTR_COMMERCE_ADMIN_TOKEN}
      GLOWSTR_ALLOWED_ORIGIN: ${GLOWSTR_ALLOWED_ORIGIN:-https://glowstr.com}
      GLOWSTR_XMR_CONFIRMATIONS: ${GLOWSTR_XMR_CONFIRMATIONS:-2}
      GLOWSTR_RELAY_USD_CENTS: ${GLOWSTR_RELAY_USD_CENTS:-1000}
      GLOWSTR_XMR_USD_URL: ${GLOWSTR_XMR_USD_URL:-https://api.kraken.com/0/public/Ticker?pair=XMRUSD}
      GLOWSTR_XMR_USD_OVERRIDE: ${GLOWSTR_XMR_USD_OVERRIDE:-}
      GLOWSTR_INVOICE_SECONDS: ${GLOWSTR_INVOICE_SECONDS:-1800}
      GLOWSTR_LATE_PAYMENT_GRACE_SECONDS: ${GLOWSTR_LATE_PAYMENT_GRACE_SECONDS:-300}
      GLOWSTR_RECONCILE_SECONDS: ${GLOWSTR_RECONCILE_SECONDS:-20}
      GLOWSTR_NIP17_PUBLIC_KEY: ${GLOWSTR_NIP17_PUBLIC_KEY:-}
    volumes:
      - glowstr-commerce:/data

  relay:
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - glowstr-relay:/app/strfry-db

  relay-gate:
    build: ../relay-gate
    restart: unless-stopped
    network_mode: host
    depends_on:
      - commerce
      - relay
    environment:
      GLOWSTR_GATE_HOST: 127.0.0.1
      GLOWSTR_GATE_PORT: 7778
      GLOWSTR_GATE_PUBLIC_RELAY: wss://${GLOWSTR_RELAY_TARGET:-relay.glowstr.com}/
      GLOWSTR_GATE_UPSTREAM: ws://127.0.0.1:7777
      GLOWSTR_COMMERCE_ADMIN_URL: http://127.0.0.1:8787/v1/admin
      GLOWSTR_COMMERCE_ADMIN_TOKEN: ${GLOWSTR_COMMERCE_ADMIN_TOKEN:?set GLOWSTR_COMMERCE_ADMIN_TOKEN}
      GLOWSTR_RELAY_FEATURE: relay_365d
      GLOWSTR_RELAY_TARGET: ${GLOWSTR_RELAY_TARGET:-relay.glowstr.com}
      GLOWSTR_ENTITLEMENT_CACHE_SECONDS: ${GLOWSTR_ENTITLEMENT_CACHE_SECONDS:-15}
      GLOWSTR_GATE_MAX_AUTH_KEYS: ${GLOWSTR_GATE_MAX_AUTH_KEYS:-64}
      GLOWSTR_ALLOW_PRIVACY_WRAPPERS: ${GLOWSTR_ALLOW_PRIVACY_WRAPPERS:-true}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  notifier:
    profiles: ["notifications"]
    build: ../nip17-notifier
    restart: unless-stopped
    network_mode: host
    depends_on:
      - commerce
    environment:
      GLOWSTR_COMMERCE_ADMIN_URL: http://127.0.0.1:8787/v1/admin
      GLOWSTR_COMMERCE_ADMIN_TOKEN: ${GLOWSTR_COMMERCE_ADMIN_TOKEN:?set GLOWSTR_COMMERCE_ADMIN_TOKEN}
      GLOWSTR_NIP17_SECRET_FILE: /run/secrets/glowstr-nip17-secret
      GLOWSTR_NIP17_EXPECTED_PUBKEY: ${GLOWSTR_NIP17_PUBLIC_KEY:-}
      GLOWSTR_NIP17_LOOKUP_RELAYS: ${GLOWSTR_NIP17_LOOKUP_RELAYS:-wss://nos.lol,wss://relay.nostr.band}
      GLOWSTR_NIP17_ALLOWED_RELAY_HOSTS: ${GLOWSTR_NIP17_ALLOWED_RELAY_HOSTS:-nos.lol,relay.nostr.band}
      GLOWSTR_NIP17_SENDER_RELAYS: ${GLOWSTR_NIP17_SENDER_RELAYS:-}
      GLOWSTR_NIP17_POLL_SECONDS: ${GLOWSTR_NIP17_POLL_SECONDS:-300}
      GLOWSTR_NIP17_RETRY_SECONDS: ${GLOWSTR_NIP17_RETRY_SECONDS:-21600}
      GLOWSTR_NIP17_BATCH_SIZE: ${GLOWSTR_NIP17_BATCH_SIZE:-25}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ${GLOWSTR_NIP17_SECRET_PATH:-./secrets/notifier.key}:/run/secrets/glowstr-nip17-secret:ro
      - glowstr-notifier:/data

volumes:
  glowstr-commerce: {}
  glowstr-relay: {}
  glowstr-notifier: {}
