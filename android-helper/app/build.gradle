plugins {
    id 'com.android.application'
}

android {
    namespace 'org.glowstr.meshbridge'
    compileSdk 36

    defaultConfig {
        applicationId 'org.glowstr.meshbridge'
        minSdk 29
        targetSdk 36
        versionCode 13
        versionName '0.3.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/glowstrAssets")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncGlowstrAsset = tasks.register('syncGlowstrAsset', Copy) {
    from('../../glowstr-v5.3-bluetooth-direct.html')
    into("$buildDir/generated/glowstrAssets")
    rename { 'glowstr.html' }

    doLast {
        def asset = file("$buildDir/generated/glowstrAssets/glowstr.html")
        def text = asset.getText('UTF-8')

        def oldAuth = '''          if (response.error) { clearTimeout(timeout); ws.close(); reject(new Error(response.error)); return; }
          if (response.result === 'auth_url') {
            // Signer wants user approval out-of-band (Amber prompts directly); keep waiting
            return;
          }'''
        def newAuth = '''          if (response.result === 'auth_url') {
            const authUrl = typeof response.error === 'string' ? response.error.trim() : '';
            if (/^https?:\\/\\//i.test(authUrl)) {
              try {
                if (window.GlowstrAndroid?.openExternal) window.GlowstrAndroid.openExternal(authUrl);
                else window.open(authUrl, '_blank', 'noopener,noreferrer');
              } catch(e) { console.warn('Could not open NIP-46 auth URL', e); }
            }
            return;
          }
          if (response.error) { clearTimeout(timeout); ws.close(); reject(new Error(response.error)); return; }'''
        if (!text.contains(oldAuth)) throw new GradleException('Could not locate NIP-46 auth challenge block')
        text = text.replace(oldAuth, newAuth)

        def oldConnect = '''    const connectParams = [signerPubkey, secret || '', NIP46_REQUESTED_PERMS, nip46ClientMetadata()];
    const connectResult = await nip46Request('connect', connectParams, 60000); // user may need to approve in signer'''
        def newConnect = '''    const connectParams = [signerPubkey, secret || '', NIP46_REQUESTED_PERMS, nip46ClientMetadata()];
    let connectResult = null;
    let connectError = null;
    for (const relayUrl of relays) {
      state.nip46.relay = relayUrl;
      try {
        connectResult = await nip46Request('connect', connectParams, 60000);
        connectError = null;
        break;
      } catch (e) {
        connectError = e;
      }
    }
    if (connectError) throw connectError;'''
        if (!text.contains(oldConnect)) throw new GradleException('Could not locate NIP-46 connect block')
        text = text.replace(oldConnect, newConnect)

        def oldNotificationTail = '''  if (state.notifications.length > 200) state.notifications.length = 200;
  if (!state.profiles[actorPubkey]) requestProfile(actorPubkey);'''
        def newNotificationTail = '''  if (state.notifications.length > 200) state.notifications.length = 200;
  try {
    const ts = createdAt || Math.floor(Date.now() / 1000);
    const fresh = ts >= Math.floor(Date.now() / 1000) - 120;
    const backgrounded = document.visibilityState !== 'visible';
    if (fresh && backgrounded && window.GlowstrAndroid?.notifyNostr) {
      window.GlowstrAndroid.notifyNostr(type, dupeKey);
    }
  } catch(e) { console.warn('Native notification bridge failed', e); }
  if (!state.profiles[actorPubkey]) requestProfile(actorPubkey);'''
        if (!text.contains(oldNotificationTail)) throw new GradleException('Could not locate notification insertion point')
        text = text.replace(oldNotificationTail, newNotificationTail)

        def oldMeshSend = '''async function glowstrMeshSendComposer(){if(!glowstrMeshConnected()){showToast('Connect Meshtastic, Reticulum, or Bluetooth Direct in RELAYS → LOCAL MESH first');switchView('relays');return;}if(!state.publicKey){showToast('Choose a signer first');switchView('keys');return;}if(state.signerMethod==='amber-nip55'){showToast('Direct mesh send needs an inline signer. Use Amber NIP-46, NIP-07, or a local key.');return;}const input=document.getElementById('compose-input'),content=input?.value?.trim()||'';if(!content){showToast('Write a note first');return;}const reply=glowstrCloneReplyContext(state.replyTo),tpl=glowstrBuildQueuedTemplate({content,replyTo:reply});let signed;try{signed=await signEventUniversal(tpl);if(!signed)throw new Error('Signer did not return an event');}catch(e){showToast('Mesh signing failed: '+(e.message||e));return;}const jobs=[];if(glowstrMesh.meshtastic.ready)jobs.push(['Meshtastic',glowstrMeshtasticSendEvent(signed)]);if(glowstrMesh.reticulum.ready)jobs.push(['Reticulum',glowstrReticulumSendEvent(signed)]);if(glowstrMesh.bluetooth.ready)jobs.push(['Bluetooth Direct',glowstrBluetoothSendEvent(signed)]);const res=await Promise.allSettled(jobs.map(x=>x[1]));const ok=res.filter(x=>x.status==='fulfilled').length;if(!ok){showToast('Mesh send failed: '+res.map(x=>x.reason?.message||'error').join(' · '));return;}await acceptVerifiedRelayEvent(signed,'mesh://local');const prefs=glowstrMeshSavePrefs();if(prefs.queueInternet){try{await glowstrQueueDraftRecord({content,replyTo:reply,status:'queued'});}catch(e){console.warn('Could not queue mesh note for later relay publish',e);}}glowstrClearComposerAfterLocalSave();showToast('📡 Handed to '+ok+' mesh transport'+(ok===1?'':'s')+(prefs.queueInternet?' · queued for Internet later':''));}'''
        def newMeshSend = '''async function glowstrMeshSendComposer(){if(!glowstrMeshConnected()){showToast('Connect Meshtastic, Reticulum, or Bluetooth Direct in RELAYS → LOCAL MESH first');switchView('relays');return;}if(!state.publicKey){showToast('Choose a signer first');switchView('keys');return;}const input=document.getElementById('compose-input'),content=input?.value?.trim()||'';if(!content){showToast('Write a note first');return;}const reply=glowstrCloneReplyContext(state.replyTo),tpl=glowstrBuildQueuedTemplate({content,replyTo:reply});let signed;try{if(state.signerMethod==='amber-nip55'&&typeof window.glowstrAmberSignForMesh==='function'){signed=await window.glowstrAmberSignForMesh(tpl);}else{signed=await signEventUniversal(tpl);}if(!signed)throw new Error('Signer did not return an event');}catch(e){showToast('Mesh signing failed: '+(e.message||e));return;}const jobs=[];if(glowstrMesh.meshtastic.ready)jobs.push(['Meshtastic',glowstrMeshtasticSendEvent(signed)]);if(glowstrMesh.reticulum.ready)jobs.push(['Reticulum',glowstrReticulumSendEvent(signed)]);if(glowstrMesh.bluetooth.ready)jobs.push(['Bluetooth Direct',glowstrBluetoothSendEvent(signed)]);const res=await Promise.allSettled(jobs.map(x=>x[1]));const ok=res.filter(x=>x.status==='fulfilled').length;if(!ok){showToast('Mesh send failed: '+res.map(x=>x.reason?.message||'error').join(' · '));return;}await acceptVerifiedRelayEvent(signed,'mesh://local');const prefs=glowstrMeshSavePrefs();if(prefs.queueInternet){try{await glowstrQueueDraftRecord({content,replyTo:reply,status:'queued'});}catch(e){console.warn('Could not queue mesh note for later relay publish',e);}}glowstrClearComposerAfterLocalSave();showToast('📡 Handed to '+ok+' mesh transport'+(ok===1?'':'s')+(prefs.queueInternet?' · queued for Internet later':''));}'''
        if (!text.contains(oldMeshSend)) throw new GradleException('Could not locate Bluetooth mesh composer')
        text = text.replace(oldMeshSend, newMeshSend)

        def oldBtSend = '''async function glowstrBluetoothSendEvent(event){if(!glowstrMesh.bluetooth.ready)throw new Error('Bluetooth Direct helper is not connected');const hops=glowstrMeshSavePrefs().btHops||5;const x=await glowstrBtFetch('/v1/send',{method:'POST',body:{event,hops},timeout:10000});const n=Math.max(0,Number(x.peers_sent)||0);glowstrMeshSetStatus('bluetooth',n?('READY · SENT TO '+n+' PEER'+(n===1?'':'S')):'READY · STORED · WAITING FOR PEER','good');return x;}'''
        def newBtSend = '''async function glowstrBluetoothSendEvent(event){if(!glowstrMesh.bluetooth.ready)throw new Error('Bluetooth Direct helper is not connected');const x=await glowstrBtFetch('/v1/send',{method:'POST',body:{event,hops:1},timeout:10000});const n=Math.max(0,Number(x.peers_sent)||0);if(!n){glowstrMeshSetStatus('bluetooth','READY · STORED · WAITING FOR PEER','good');return x;}glowstrMeshSetStatus('bluetooth','READY · SENT · WAITING FOR ACK','good');for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,250));try{const d=await glowstrBtFetch('/v1/delivery?id='+encodeURIComponent(event.id),{timeout:2500});if(d?.delivered){const a=Math.max(1,Number(d.acks)||1);glowstrMeshSetStatus('bluetooth','READY · DELIVERED TO '+a+' PEER'+(a===1?'':'S'),'good');x.delivery=d;break;}}catch(e){}}return x;}'''
        if (!text.contains(oldBtSend)) throw new GradleException('Could not locate Bluetooth send function')
        text = text.replace(oldBtSend, newBtSend)

        def nativeAmber = '''
// === ANDROID NATIVE NIP-55 + STORE-AND-FORWARD QUEUE ===
if (window.GlowstrAndroid && typeof window.GlowstrAndroid.amberGetPublicKey === 'function') {
  let __glowstrAmberPoll = null;
  let __glowstrAmberBusy = false;
  let __glowstrAmberMode = null;
  let __glowstrMeshResolve = null;
  let __glowstrMeshReject = null;
  let __glowstrQueueDrainActive = false;
  let __glowstrQueuePendingId = null;
  let __glowstrQueuePauseUntil = 0;
  const __glowstrOriginalPublishQueued = glowstrPublishQueued;

  function __glowstrStopAmberPoll() {
    if (__glowstrAmberPoll) clearInterval(__glowstrAmberPoll);
    __glowstrAmberPoll = null;
  }

  function __glowstrFinishMeshSigning(error, signed) {
    const resolve = __glowstrMeshResolve;
    const reject = __glowstrMeshReject;
    __glowstrMeshResolve = null;
    __glowstrMeshReject = null;
    __glowstrAmberBusy = false;
    __glowstrAmberMode = null;
    document.getElementById('signing-indicator')?.classList.remove('active');
    if (error) {
      if (reject) reject(error instanceof Error ? error : new Error(String(error)));
    } else if (resolve) {
      resolve(signed);
    }
  }


  function __glowstrQueuePause(ms, message) {
    __glowstrQueuePauseUntil = Date.now() + Math.max(0, Number(ms) || 0);
    __glowstrQueueDrainActive = false;
    __glowstrQueuePendingId = null;
    __glowstrAmberBusy = false;
    __glowstrAmberMode = null;
    document.getElementById('signing-indicator')?.classList.remove('active');
    if (message) showToast(message);
  }

  async function __glowstrFinishQueuedSignedEvent(signed, requested) {
    const id = __glowstrQueuePendingId;
    const all = await glowstrOfflineGetAll();
    const rec = all.find(x => x.id === id && x.status === 'queued');
    if (!rec) {
      __glowstrQueuePause(0, 'Queued note was removed before publishing');
      return;
    }

    // Signed Nostr events are public data. Keep the already-verified signed event
    // until a relay ACK arrives so retries reuse the SAME event id instead of
    // creating duplicate notes if an ACK is lost.
    rec.signedEvent = signed;
    rec.signedRequested = requested;
    rec.updatedAt = Date.now();
    await glowstrOfflinePut(rec);

    const sent = broadcastEvent(signed);
    if (sent < 1) {
      __glowstrQueuePause(5000, 'Connection disappeared — signed note kept in queue');
      return;
    }

    const acked = await glowstrWaitForPublishAck(signed.id, 5000);
    if (!acked) {
      __glowstrQueuePause(15000, 'No relay ACK yet — exact signed event kept for retry');
      return;
    }

    await glowstrOfflineDelete(rec.id);
    await glowstrUpdateOfflineBadge();
    try { await glowstrRenderOfflineManager(); } catch(e) {}
    __glowstrQueueDrainActive = false;
    __glowstrQueuePendingId = null;
    __glowstrAmberBusy = false;
    __glowstrAmberMode = null;
    document.getElementById('signing-indicator')?.classList.remove('active');
    showToast('✓ Queued note published and acknowledged');
    setTimeout(() => __glowstrMaybeDrainQueue(false), 650);
  }

  async function __glowstrRetryAlreadySigned(rec) {
    if (!rec?.signedEvent || !rec?.signedRequested) return false;
    let valid = false;
    try { valid = await glowstrValidateSignerResult(rec.signedRequested, rec.signedEvent); }
    catch(e) { valid = false; }
    if (!valid) {
      delete rec.signedEvent;
      delete rec.signedRequested;
      rec.updatedAt = Date.now();
      await glowstrOfflinePut(rec);
      return false;
    }

    __glowstrQueueDrainActive = true;
    __glowstrQueuePendingId = rec.id;
    const sent = broadcastEvent(rec.signedEvent);
    if (sent < 1) {
      __glowstrQueuePause(5000, null);
      return true;
    }
    const acked = await glowstrWaitForPublishAck(rec.signedEvent.id, 5000);
    if (acked) {
      await glowstrOfflineDelete(rec.id);
      await glowstrUpdateOfflineBadge();
      try { await glowstrRenderOfflineManager(); } catch(e) {}
      __glowstrQueueDrainActive = false;
      __glowstrQueuePendingId = null;
      showToast('✓ Queued note acknowledged');
      setTimeout(() => __glowstrMaybeDrainQueue(false), 650);
    } else {
      __glowstrQueuePause(15000, null);
    }
    return true;
  }

  async function __glowstrMaybeDrainQueue(force = false) {
    if (__glowstrQueueDrainActive || __glowstrAmberBusy) return;
    if (!force && Date.now() < __glowstrQueuePauseUntil) return;
    if (document.visibilityState !== 'visible') return;
    if (navigator.onLine === false || !glowstrHasWritableConnection()) return;
    if (!state.publicKey || state.signerMethod !== 'amber-nip55') return;
    try {
      if (!window.GlowstrAndroid.amberSignerAvailable()) return;
      const all = (await glowstrOfflineGetAll())
        .filter(x => x.status === 'queued')
        .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
      if (!all.length) return;
      const rec = all[0];

      if (await __glowstrRetryAlreadySigned(rec)) return;

      const template = glowstrBuildQueuedTemplate(rec);
      template.pubkey = state.publicKey;
      glowstrSaveAmberPendingEvent(template);
      __glowstrQueueDrainActive = true;
      __glowstrQueuePendingId = rec.id;
      __glowstrAmberBusy = true;
      __glowstrAmberMode = 'queue';
      document.getElementById('signing-indicator')?.classList.add('active');
      if (!window.GlowstrAndroid.amberApproveEvent(JSON.stringify(template))) {
        __glowstrQueuePause(15000, 'Could not open Amber — note remains queued');
        return;
      }
      showToast('Queued note ready — approve it in Amber');
      __glowstrStartAmberPoll('queue');
    } catch(e) {
      console.warn('Automatic queued publish failed', e);
      __glowstrQueuePause(15000, 'Queued note kept locally');
    }
  }

  function __glowstrStartAmberPoll(mode) {
    __glowstrStopAmberPoll();
    __glowstrAmberMode = mode;
    let attempts = 0;
    __glowstrAmberPoll = setInterval(async () => {
      attempts++;
      let raw = '';
      try { raw = window.GlowstrAndroid.pollAmberResult() || ''; } catch(e) {}
      if (!raw) {
        if (attempts > 480) {
          __glowstrStopAmberPoll();
          if (mode === 'queue') __glowstrQueuePause(30000, 'Amber timed out — note remains queued');
          else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error('Amber timed out'));
          else {
            __glowstrAmberBusy = false;
            __glowstrAmberMode = null;
            document.getElementById('signing-indicator')?.classList.remove('active');
            showToast('Amber request timed out');
          }
        }
        return;
      }
      __glowstrStopAmberPoll();
      let data;
      try { data = JSON.parse(raw); }
      catch(e) {
        if (mode === 'queue') __glowstrQueuePause(30000, 'Amber returned invalid data — note remains queued');
        else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error('Amber returned invalid Android result'));
        else { __glowstrAmberBusy = false; showToast('Amber returned invalid Android result'); }
        return;
      }

      document.getElementById('signing-indicator')?.classList.remove('active');
      if (data.rejected) {
        if (mode === 'queue') __glowstrQueuePause(5 * 60 * 1000, 'Amber rejected it — note remains queued');
        else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error('Amber request rejected'));
        else { __glowstrAmberBusy = false; __glowstrAmberMode = null; showToast('Amber request rejected'); }
        return;
      }
      if (!data.ok) {
        if (mode === 'queue') __glowstrQueuePause(30000, data.error || 'Amber failed — note remains queued');
        else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error(data.error || 'Amber request failed'));
        else { __glowstrAmberBusy = false; __glowstrAmberMode = null; showToast(data.error || 'Amber request failed'); }
        return;
      }

      if (data.type === 'amber_get_public_key') {
        const pk = String(data.result || '').trim().toLowerCase();
        __glowstrAmberBusy = false;
        __glowstrAmberMode = null;
        if (!/^[0-9a-f]{64}$/.test(pk)) { showToast('Amber returned an invalid public key'); return; }
        state.publicKey = pk;
        state.signerMethod = 'amber-nip55';
        showLoggedIn();
        saveState();
        subscribeUserSpecificEvents();
        showToast('✓ Connected to Amber with native NIP-55');
        setTimeout(() => __glowstrMaybeDrainQueue(false), 700);
        return;
      }

      if (data.type === 'amber_sign_event') {
        const requested = glowstrTakeAmberPendingEvent();
        if (!requested) {
          if (mode === 'queue') __glowstrQueuePause(30000, 'Amber signing request expired — note remains queued');
          else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error('Amber signing request expired'));
          else { __glowstrAmberBusy = false; __glowstrAmberMode = null; showToast('Amber signing request expired'); }
          return;
        }
        try {
          const signed = JSON.parse(String(data.event || ''));
          if (!(signed.sig && signed.id && await glowstrValidateSignerResult(requested, signed))) {
            if (mode === 'queue') __glowstrQueuePause(5 * 60 * 1000, 'Amber returned a mismatched event — note remains queued');
            else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error('Amber returned a mismatched signed event'));
            else { __glowstrAmberBusy = false; __glowstrAmberMode = null; showToast('Amber returned a mismatched signed event'); }
            return;
          }
          if (mode === 'queue') {
            await __glowstrFinishQueuedSignedEvent(signed, requested);
          } else if (mode === 'mesh') {
            __glowstrFinishMeshSigning(null, signed);
          } else {
            __glowstrAmberBusy = false;
            __glowstrAmberMode = null;
            const sent = broadcastEvent(signed);
            if (signed.kind === 42) {
              state.eventIds.add(signed.id);
              const channelId = glowstrCacheChatEvent(signed);
              const input = document.getElementById('chat-input');
              if (input) input.value = '';
              state.chatUnreadCount = 0;
              if (channelId) glowstrScheduleChatRender(channelId, false);
              showToast(sent > 0 ? '✓ Chat message sent' : 'No connected relay could send the message');
            } else if (signed.kind === 40) {
              try {
                const meta = JSON.parse(signed.content || '{}');
                const joined = getJoinedRooms();
                if (!joined.includes(signed.id)) { joined.push(signed.id); setJoinedRooms(joined); }
                state.chatRooms = state.chatRooms || [];
                if (!state.chatRooms.some(r => r.id === signed.id)) state.chatRooms.unshift({id:signed.id,creator:signed.pubkey,name:meta.name||'Untitled',about:meta.about||'',picture:meta.picture||'',created_at:signed.created_at});
                closeCreateRoomModal();
                ['room-name','room-about','room-picture'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
                showToast(sent > 0 ? '💬 Room opened' : 'Room signed, but no relay is connected');
                if (sent > 0) setTimeout(() => enterChatRoom(signed.id), 250);
              } catch(e) { showToast('Room signed, but could not open it locally'); }
            } else {
              showToast('✓ Signed by Amber, verified, and broadcast');
            }
          }
        } catch(e) {
          if (mode === 'queue') __glowstrQueuePause(30000, 'Could not process Amber result — note remains queued');
          else if (mode === 'mesh') __glowstrFinishMeshSigning(new Error('Could not parse Amber signed event'));
          else { __glowstrAmberBusy = false; __glowstrAmberMode = null; showToast('Could not parse Amber signed event'); }
        }
      }
    }, 250);
  }

  loginWithAmber = function() {
    if (__glowstrAmberBusy || __glowstrQueueDrainActive) { showToast('Amber is already handling a request'); return; }
    try {
      if (!window.GlowstrAndroid.amberSignerAvailable()) { showAmberNotInstalledHelp(); return; }
      state.amberPendingAction = 'get_public_key';
      state.amberPendingTimestamp = Date.now();
      __glowstrAmberBusy = true;
      __glowstrAmberMode = 'login';
      if (!window.GlowstrAndroid.amberGetPublicKey()) {
        __glowstrAmberBusy = false;
        __glowstrAmberMode = null;
        showToast('Could not open Amber');
        return;
      }
      showToast('Opening Amber…');
      __glowstrStartAmberPoll('login');
    } catch(e) {
      __glowstrAmberBusy = false;
      __glowstrAmberMode = null;
      showToast('Amber launch failed: ' + (e.message || e));
    }
  };

  signWithAmber = function(eventJson) {
    if (__glowstrAmberBusy || __glowstrQueueDrainActive) { showToast('Amber is already handling a queued post'); return; }
    state.amberPendingAction = 'sign_event';
    try { glowstrSaveAmberPendingEvent(JSON.parse(eventJson)); }
    catch(e) { throw new Error('Invalid Amber event request'); }
    document.getElementById('signing-indicator')?.classList.add('active');
    try {
      __glowstrAmberBusy = true;
      __glowstrAmberMode = 'normal';
      if (!window.GlowstrAndroid.amberApproveEvent(eventJson)) {
        __glowstrAmberBusy = false;
        __glowstrAmberMode = null;
        document.getElementById('signing-indicator')?.classList.remove('active');
        showToast('Could not open Amber signer');
        return;
      }
      __glowstrStartAmberPoll('normal');
    } catch(e) {
      __glowstrAmberBusy = false;
      __glowstrAmberMode = null;
      document.getElementById('signing-indicator')?.classList.remove('active');
      showToast('Amber signing failed: ' + (e.message || e));
    }
  };

  window.glowstrAmberSignForMesh = function(event) {
    return new Promise((resolve, reject) => {
      if (__glowstrAmberBusy || __glowstrQueueDrainActive) {
        reject(new Error('Amber is already handling another request'));
        return;
      }
      let requested;
      try {
        requested = typeof event === 'string' ? JSON.parse(event) : event;
        if (!requested || typeof requested !== 'object') throw new Error('Invalid event');
        requested.pubkey = state.publicKey;
        glowstrSaveAmberPendingEvent(requested);
      } catch(e) {
        reject(new Error('Invalid Amber event request'));
        return;
      }
      __glowstrMeshResolve = resolve;
      __glowstrMeshReject = reject;
      __glowstrAmberBusy = true;
      __glowstrAmberMode = 'mesh';
      document.getElementById('signing-indicator')?.classList.add('active');
      try {
        if (!window.GlowstrAndroid.amberApproveEvent(JSON.stringify(requested))) {
          __glowstrFinishMeshSigning(new Error('Could not open Amber signer'));
          return;
        }
        showToast('Offline note ready — approve it in Amber');
        __glowstrStartAmberPoll('mesh');
      } catch(e) {
        __glowstrFinishMeshSigning(new Error('Amber signing failed: ' + (e.message || e)));
      }
    });
  };

  // Manual queue button becomes an explicit retry/resume control for Amber.
  glowstrPublishQueued = async function() {
    if (state.signerMethod !== 'amber-nip55') return __glowstrOriginalPublishQueued();
    __glowstrQueuePauseUntil = 0;
    await __glowstrMaybeDrainQueue(true);
  };

  // Reconnect detection: no Google push/service required. We only open Amber while
  // Glowstr is visible; if connectivity returns in the background, the durable queue
  // waits until the user returns to the app.
  window.addEventListener('online', () => setTimeout(() => __glowstrMaybeDrainQueue(false), 500));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') setTimeout(() => __glowstrMaybeDrainQueue(false), 500);
  });
