name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths: ['android-helper/**', 'tests/**', 'monero-commerce/**', 'glowstr-v5.3-bluetooth-direct.html', 'glowstr-v5.4-relay-domain-secure.html', 'glowstr-v5.5-relay-frostr-media.html', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android-helper/**', 'tests/**', 'monero-commerce/**', 'glowstr-v5.3-bluetooth-direct.html', 'glowstr-v5.4-relay-domain-secure.html', 'glowstr-v5.5-relay-frostr-media.html', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Run client and commerce regression checks
        run: |
          python3 tests/run_tests.py
          node tests/security-regression.cjs
          node tests/media-wallet-regression.cjs
          node tests/media-wallet-regression.cjs glowstr-v5.5-relay-frostr-media.html
          node tests/security-regression.cjs glowstr-v5.5-relay-frostr-media.html
          node tests/relay-rewire-regression.cjs
          python3 tests/test_commerce.py
      - name: Run cryptography and bridge isolation checks
        run: |
          mkdir -p android-helper/build/crypto-tests
          javac -encoding UTF-8 -d android-helper/build/crypto-tests \
            android-helper/app/src/main/java/org/glowstr/meshbridge/NostrCrypto.java \
            android-helper/app/src/main/java/org/glowstr/meshbridge/TrustedWebContent.java \
            tests/java/org/glowstr/meshbridge/NostrCryptoSelfTest.java \
            tests/java/org/glowstr/meshbridge/TrustedWebContentSelfTest.java
          java -cp android-helper/build/crypto-tests org.glowstr.meshbridge.NostrCryptoSelfTest
          java -cp android-helper/build/crypto-tests org.glowstr.meshbridge.TrustedWebContentSelfTest
      - name: Test Android scoped file picker
        run: gradle -p android-helper --no-daemon --stacktrace :app:testMediafixUnitTest :app:testIntegratedUnitTest
      - name: Build non-debuggable release APK for verification
        run: gradle -p android-helper --no-daemon --stacktrace :app:assembleRelease :app:lintRelease
      - name: Verify release manifest
        run: |
          APK=android-helper/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/glowstr-manifest.txt
          python3 tests/check_release_manifest.py /tmp/glowstr-manifest.txt
      - name: Record unsigned APK SHA-256
        run: |
          cd android-helper/app/build/outputs/apk/release
          sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256
      - name: Upload unsigned review APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-Unsigned-Review
          path: |
            android-helper/app/build/outputs/apk/release/app-release-unsigned.apk
            android-helper/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build installable media-fix test APK
        run: |
          set -euo pipefail
          gradle -p android-helper --no-daemon --stacktrace :app:assembleMediafix
          mkdir -p dist
          cp android-helper/app/build/outputs/apk/mediafix/app-mediafix.apk dist/Glowstr-Android-0.3.17-mediafix.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Glowstr-Android-0.3.17-mediafix.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Glowstr-Android-0.3.17-mediafix.apk
          sha256sum dist/Glowstr-Android-0.3.17-mediafix.apk > dist/Glowstr-Android-0.3.17-mediafix.apk.sha256
      - name: Upload installable media-fix test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-Media-Fix
          path: |
            dist/Glowstr-Android-0.3.17-mediafix.apk
            dist/Glowstr-Android-0.3.17-mediafix.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build installable relay-rewire preview APK
        run: |
          set -euo pipefail
          gradle -p android-helper --no-daemon --stacktrace :app:assembleRelayrewire
          mkdir -p dist
          cp android-helper/app/build/outputs/apk/relayrewire/app-relayrewire.apk dist/Glowstr-Android-0.3.17-relayrewire.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Glowstr-Android-0.3.17-relayrewire.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Glowstr-Android-0.3.17-relayrewire.apk | grep "package: name='org.glowstr.meshbridge.relayrewire'"
          sha256sum dist/Glowstr-Android-0.3.17-relayrewire.apk > dist/Glowstr-Android-0.3.17-relayrewire.apk.sha256
      - name: Upload relay-rewire preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-Relay-Rewire-Preview
          path: |
            dist/Glowstr-Android-0.3.17-relayrewire.apk
            dist/Glowstr-Android-0.3.17-relayrewire.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish relay-rewire preview APK prerelease
        if: false # Superseded by the consolidated integrated preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.3.15-relay-rewire-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/Glowstr-Android-0.3.17-relayrewire.apk \
            dist/Glowstr-Android-0.3.17-relayrewire.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Glowstr Android 0.3.15 Relay Rewire Preview" \
            --notes "Test-signed side-by-side APK (org.glowstr.meshbridge.relayrewire), not a production signing-key upgrade. Bundles Glowstr v5.4 with the live wss://notafbihoneypotrelay.com relay, /xmr-commerce/v1 payments, annual and lifetime XMR relay plans, and a fail-closed USD 4 NIP-05 name storefront. NIP-05 remains unavailable until the operator deploys the name-service backend and configures the real domain. Keep your existing APK installed and back up any local signing key before switching applications." \
            --prerelease

      - name: Build combined media / FROSTR / relay APK
        run: |
          set -euo pipefail
          gradle -p android-helper --no-daemon --stacktrace :app:assembleIntegrated
          mkdir -p dist
          cp android-helper/app/build/outputs/apk/integrated/app-integrated.apk dist/Glowstr-Android-0.3.17-integrated.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Glowstr-Android-0.3.17-integrated.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Glowstr-Android-0.3.17-integrated.apk | grep "package: name='org.glowstr.meshbridge.integrated'"
          sha256sum dist/Glowstr-Android-0.3.17-integrated.apk > dist/Glowstr-Android-0.3.17-integrated.apk.sha256
      - name: Upload combined Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-FROSTR-Media-Relay-Integrated
          path: |
            dist/Glowstr-Android-0.3.17-integrated.apk
            dist/Glowstr-Android-0.3.17-integrated.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
