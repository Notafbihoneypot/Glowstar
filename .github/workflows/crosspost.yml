name: Test Crosspost
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crosspost/**", "glowstr-v5.3-bluetooth-direct.html", ".github/workflows/crosspost.yml"]
  pull_request:
    paths: ["crosspost/**", "glowstr-v5.3-bluetooth-direct.html", ".github/workflows/crosspost.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crosspost/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: crosspost
      - run: npm test
        working-directory: crosspost
      - run: python3 -m py_compile monero-commerce/server.py
      - run: bash -n deploy/podman/deploy.sh deploy/podman/status.sh
      - run: npx playwright install --with-deps chromium
        working-directory: crosspost
      - run: npm run test:browser
        working-directory: crosspost
      - run: python3 tests/run_tests.py
