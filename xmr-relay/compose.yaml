services:
  commerce:
    build: ../monero-commerce
    restart: unless-stopped
    network_mode: host
    environment:
      GLOWSTR_COMMERCE_HOST: 127.0.0.1
      GLOWSTR_COMMERCE_PORT: 8787
      MONERO_WALLET_RPC: ${MONERO_WALLET_RPC:-http://127.0.0.1:18083/json_rpc}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-}
      MONERO_RPC_PASS: ${MONERO_RPC_PASS:-}
      GLOWSTR_COMMERCE_ADMIN_TOKEN: ${GLOWSTR_COMMERCE_ADMIN_TOKEN:?set GLOWSTR_COMMERCE_ADMIN_TOKEN}
      GLOWSTR_ALLOWED_ORIGIN: ${GLOWSTR_ALLOWED_ORIGIN:-https://glowstr.com}
      GLOWSTR_XMR_CONFIRMATIONS: ${GLOWSTR_XMR_CONFIRMATIONS:-2}
    volumes:
      - glowstr-commerce:/data

  relay:
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      - commerce
    environment:
      GLOWSTR_COMMERCE_ADMIN_URL: http://127.0.0.1:8787/v1/admin
      GLOWSTR_COMMERCE_ADMIN_TOKEN: ${GLOWSTR_COMMERCE_ADMIN_TOKEN:?set GLOWSTR_COMMERCE_ADMIN_TOKEN}
      GLOWSTR_RELAY_FEATURE: relay_30d
      GLOWSTR_RELAY_TARGET: ${GLOWSTR_RELAY_TARGET:-relay.glowstr.com}
      GLOWSTR_ENTITLEMENT_CACHE_SECONDS: ${GLOWSTR_ENTITLEMENT_CACHE_SECONDS:-20}
      GLOWSTR_COMMERCE_TIMEOUT_SECONDS: ${GLOWSTR_COMMERCE_TIMEOUT_SECONDS:-3}
      GLOWSTR_ALLOW_LOCAL_IMPORTS: ${GLOWSTR_ALLOW_LOCAL_IMPORTS:-true}
      GLOWSTR_REQUIRE_AUTHOR_MATCH: ${GLOWSTR_REQUIRE_AUTHOR_MATCH:-true}
    volumes:
      - glowstr-relay:/app/strfry-db

volumes:
  glowstr-commerce: {}
  glowstr-relay: {}
