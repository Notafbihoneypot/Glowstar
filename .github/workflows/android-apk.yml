name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Build with the configured production signing key
        type: boolean
        default: false
  pull_request:
    paths: ['android-helper/**', 'tests/**', 'monero-commerce/**', 'glowstr-v5.3-bluetooth-direct.html', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android-helper/**', 'tests/**', 'monero-commerce/**', 'glowstr-v5.3-bluetooth-direct.html', '.github/workflows/android-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Run client and commerce regression checks
        run: |
          python3 tests/run_tests.py
          node tests/security-regression.cjs
          python3 tests/test_commerce.py
      - name: Run cryptography and bridge isolation checks
        run: |
          mkdir -p android-helper/build/crypto-tests
          javac -encoding UTF-8 -d android-helper/build/crypto-tests \
            android-helper/app/src/main/java/org/glowstr/meshbridge/NostrCrypto.java \
            android-helper/app/src/main/java/org/glowstr/meshbridge/TrustedWebContent.java \
            tests/java/org/glowstr/meshbridge/NostrCryptoSelfTest.java \
            tests/java/org/glowstr/meshbridge/TrustedWebContentSelfTest.java
          java -cp android-helper/build/crypto-tests org.glowstr.meshbridge.NostrCryptoSelfTest
          java -cp android-helper/build/crypto-tests org.glowstr.meshbridge.TrustedWebContentSelfTest
      - name: Build non-debuggable release APK for verification
        run: gradle -p android-helper --no-daemon --stacktrace :app:assembleRelease :app:lintRelease
      - name: Verify release manifest
        run: |
          APK=android-helper/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/glowstr-manifest.txt
          python3 tests/check_release_manifest.py /tmp/glowstr-manifest.txt
      - name: Upload unsigned review APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-Unsigned-Review
          path: android-helper/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build installable FROSTR test APK
        run: |
          set -euo pipefail
          gradle -p android-helper --no-daemon --stacktrace :app:assembleDebug
          mkdir -p dist
          cp android-helper/app/build/outputs/apk/debug/app-debug.apk dist/Glowstr-Android-0.3.12-FROSTR-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Glowstr-Android-0.3.12-FROSTR-test.apk
          sha256sum dist/Glowstr-Android-0.3.12-FROSTR-test.apk > dist/Glowstr-Android-0.3.12-FROSTR-test.apk.sha256
      - name: Upload installable FROSTR test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glowstr-Android-FROSTR-Test
          path: |
            dist/Glowstr-Android-0.3.12-FROSTR-test.apk
            dist/Glowstr-Android-0.3.12-FROSTR-test.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed
    needs: build
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build and verify signed production APK
        env:
          GLOWSTR_RELEASE_KEYSTORE_BASE64: ${{ secrets.GLOWSTR_RELEASE_KEYSTORE_BASE64 }}
          GLOWSTR_RELEASE_STORE_PASSWORD: ${{ secrets.GLOWSTR_RELEASE_STORE_PASSWORD }}
          GLOWSTR_RELEASE_KEY_ALIAS: ${{ secrets.GLOWSTR_RELEASE_KEY_ALIAS }}
          GLOWSTR_RELEASE_KEY_PASSWORD: ${{ secrets.GLOWSTR_RELEASE_KEY_PASSWORD }}
          GLOWSTR_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          set -euo pipefail
          umask 077
          export GLOWSTR_RELEASE_STORE_FILE="$RUNNER_TEMP/glowstr-release.jks"
          trap 'rm -f "$GLOWSTR_RELEASE_STORE_FILE"' EXIT
          test -n "$GLOWSTR_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$GLOWSTR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GLOWSTR_RELEASE_STORE_FILE"
          gradle -p android-helper --no-daemon :app:assembleRelease
          mkdir -p dist
          cp android-helper/app/build/outputs/apk/release/app-release.apk dist/Glowstr-Android-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Glowstr-Android-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree dist/Glowstr-Android-release.apk AndroidManifest.xml > /tmp/glowstr-manifest.txt
          python3 tests/check_release_manifest.py /tmp/glowstr-manifest.txt
          sha256sum dist/Glowstr-Android-release.apk > dist/Glowstr-Android-release.apk.sha256
      - name: Upload signed production APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Glowstr-Android-Signed-Release
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
