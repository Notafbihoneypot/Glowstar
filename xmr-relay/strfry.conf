db = "/app/strfry-db/"

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Caddy is the only public listener. Host-networked Podman keeps strfry on loopback.
    bind = "127.0.0.1"
    port = 7777
    nofiles = 65536
    realIpHeader = "x-real-ip"

    auth {
        enabled = true
        serviceUrl = "wss://relay.glowstr.com/"
        restrictedReadKinds = ""
        restrictReadToInvolvedPubkey = false
    }

    info {
        name = "Glowstr XMR Relay"
        description = "Public-read Nostr relay. Publishing requires NIP-42 authentication plus an active Monero relay membership."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = "[1,2,4,9,11,28,40,42,45,70,77]"
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 100
    autoPingSeconds = 45
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 5
    maxFilterLimitCount = 250000
    maxSubsPerConnection = 100
    maxPendingOutboundBytes = 16777216

    writePolicy {
        plugin = "/usr/local/bin/glowstr-xmr-policy"
        timeoutSeconds = 5
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 250000
    }

    filterValidation {
        enabled = true
        maxFiltersPerReq = 5
        minFiltersPerReq = 1
        maxKindsPerFilter = 32
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
