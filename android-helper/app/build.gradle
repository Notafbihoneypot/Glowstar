plugins {
    id 'com.android.application'
}

android {
    namespace 'org.glowstr.meshbridge'
    compileSdk 36

    defaultConfig {
        applicationId 'org.glowstr.meshbridge'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/glowstrAssets")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncGlowstrAsset = tasks.register('syncGlowstrAsset', Copy) {
    from('../../glowstr-v5.3-bluetooth-direct.html')
    into("$buildDir/generated/glowstrAssets")
    rename { 'glowstr.html' }
}

tasks.named('preBuild').configure {
    dependsOn(syncGlowstrAsset)
}
