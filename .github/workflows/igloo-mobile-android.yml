name: Build Igloo Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [igloo-mobile-rust]
    paths:
      - 'igloo-mobile/**'
      - '.github/workflows/igloo-mobile-android.yml'

permissions:
  contents: write

concurrency:
  group: igloo-mobile-android-${{ github.ref }}
  cancel-in-progress: true

env:
  KEEP_ANDROID_SHA: f0db28aa218f18b71be60e3b1cf39eb51705e791
  KEEP_CORE_SHA: d9192f5801949700dbefff2c9634b0fe904edf9e
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: "29.0.14206865"
  CARGO_NDK_VERSION: "4.1.2"
  RUST_VERSION: "1.89.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out Glowstr overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out pinned Keep Android and Rust core
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/privkeyio/keep-android.git upstream-keep-android
          git -C upstream-keep-android checkout --detach "$KEEP_ANDROID_SHA"
          git clone --filter=blob:none https://github.com/privkeyio/keep.git upstream-keep-android/keep
          git -C upstream-keep-android/keep checkout --detach "$KEEP_CORE_SHA"
          test "$(cat upstream-keep-android/keep.version)" = "$KEEP_CORE_SHA"
          test "$(git -C upstream-keep-android rev-parse HEAD)" = "$KEEP_ANDROID_SHA"
          test "$(git -C upstream-keep-android/keep rev-parse HEAD)" = "$KEEP_CORE_SHA"

      - name: Apply Igloo Mobile overlay
        run: python3 igloo-mobile/apply-overlay.py upstream-keep-android

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build ARM64 Android APK
        working-directory: upstream-keep-android
        env:
          KEEP_REPO: ${{ github.workspace }}/upstream-keep-android/keep
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TARGETS: aarch64-linux-android
          AWS_LC_SYS_CMAKE_BUILDER: "1"
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mapfile -t APKS < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          printf 'Built APKs:\n%s\n' "${APKS[*]}"
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" "$GITHUB_WORKSPACE/dist/Igloo-Mobile-0.1.0-test-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/dist/Igloo-Mobile-0.1.0-test-arm64.apk" ||             "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/dist/Igloo-Mobile-0.1.0-test-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/Igloo-Mobile-0.1.0-test-arm64.apk" > "$GITHUB_WORKSPACE/dist/Igloo-Mobile-0.1.0-test-arm64.apk.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Igloo-Mobile-Android-ARM64
          path: |
            dist/Igloo-Mobile-0.1.0-test-arm64.apk
            dist/Igloo-Mobile-0.1.0-test-arm64.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish direct APK prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="igloo-mobile-v0.1.0-test"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG"             dist/Igloo-Mobile-0.1.0-test-arm64.apk             dist/Igloo-Mobile-0.1.0-test-arm64.apk.sha256             igloo-mobile/THIRD_PARTY_NOTICES.md             --target "$GITHUB_SHA"             --title "Igloo Mobile 0.1.0 Android Test"             --notes "ARM64 Android prototype derived from pinned Keep Android/Keep Rust. Generates FROST threshold identities on Android and exposes NIP-46 bunker signing for Glowstr. Recommended setup uses distributed DKG across separate signer devices. Test build; not yet audited as a Glowstr distribution."             --prerelease
